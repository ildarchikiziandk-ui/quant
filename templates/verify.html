{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto; text-align: center;">
    <div style="font-size: 32px; margin-bottom: 12px;">📧</div>
    <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Подтверди email</h2>
    <p style="color: #888; font-size: 14px; margin-bottom: 24px;">Мы отправили код на <b>{{ email }}</b></p>
    {% if error %}
    <div class="alert-error">⚠️ {{ error }}</div>
    {% endif %}
    <form method="post" action="/verify">
        <input type="hidden" name="email" value="{{ email }}">
        <input type="hidden" name="username" value="{{ username }}">
        <input type="hidden" name="name" value="{{ name }}">
        <input type="hidden" name="password" value="{{ password }}">
        <input type="text" name="code" placeholder="Введи 6-значный код" maxlength="6" style="text-align: center; font-size: 24px; letter-spacing: 8px; font-weight: 700;" required autofocus>
        <button class="btn" style="width: 100%;">Подтвердить</button>
    </form>
    <p style="margin-top: 16px; font-size: 13px; color: #888;">Не получил письмо? Проверь папку "Спам"</p>
</div>
{% endblock %}
