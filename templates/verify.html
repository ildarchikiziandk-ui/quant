{% extends "bare.html" %}
{% block title %}Подтверждение email — {{ brand }}{% endblock %}
{% block card %}
<h1 class="center" style="font-size:20px;font-weight:800;margin-bottom:4px">Подтвердите email</h1>
<p class="center muted small mb">Мы отправили код на <b>{{ user.email }}</b></p>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" action="/verify">
  <input name="code" inputmode="numeric" maxlength="6" placeholder="000000" required autofocus style="text-align:center;font-size:24px;letter-spacing:8px;margin-bottom:12px">
  <button class="btn block">Подтвердить</button>
</form>
<form method="post" action="/verify/resend" class="center mt"><button class="btn soft sm">Отправить код ещё раз</button></form>
<p class="center mt small"><a href="/" class="muted">Пропустить пока</a></p>
{% endblock %}
