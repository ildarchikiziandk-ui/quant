{% macro owner_badge() %}
<span class="badge-owner" title="Владелец Quant">
    <svg width="10" height="10" viewBox="0 0 12 12" fill="none"><path d="M6 1L7.5 4.5L11 5L8.5 7.5L9 11L6 9.5L3 11L3.5 7.5L1 5L4.5 4.5L6 1Z" fill="white" stroke="white" stroke-width="0.5"/></svg>
</span>
{% endmacro %}

{% macro verify_badge() %}
<span class="badge-verify" title="Верифицированный аккаунт">
    <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 5L4 7L8 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
</span>
{% endmacro %}

{% macro star_badge() %}
<span class="badge-star" title="Особый аккаунт">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <defs><linearGradient id="sg" x1="0" y1="0" x2="16" y2="16" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f59e0b"/><stop offset="50%" stop-color="#ef4444"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient></defs>
        <path d="M8 1L9.8 5.8L15 6.3L11.2 9.7L12.4 15L8 12.3L3.6 15L4.8 9.7L1 6.3L6.2 5.8L8 1Z" fill="url(#sg)"/>
    </svg>
</span>
{% endmacro %}

{% macro mod_badge() %}
<span class="badge-mod" title="Модератор">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 1L14 4V8C14 11.5 11.5 14.5 8 15.5C4.5 14.5 2 11.5 2 8V4L8 1Z" fill="#10b981" stroke="#059669" stroke-width="0.5"/>
        <path d="M5 8L7 10L11 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</span>
{% endmacro %}
