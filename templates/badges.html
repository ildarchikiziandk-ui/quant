{% macro owner_badge() %}
<span class="badge-owner" title="Владелец Quant">
<svg width="12" height="12" viewBox="0 0 12 12" fill="none">
<path d="M6 1L7.5 4.5L11 5L8.5 7.5L9 11L6 9.5L3 11L3.5 7.5L1 5L4.5 4.5L6 1Z" fill="white" stroke="white" stroke-width="0.5"/>
</svg>
</span>
{% endmacro %}

{% macro verify_badge() %}
<span class="badge-verify" title="Верифицированный аккаунт">
<svg width="10" height="10" viewBox="0 0 10 10" fill="none">
<path d="M2 5L4 7L8 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</span>
{% endmacro %}

{% macro star_badge(color='#fbbf24') %}
<span class="badge-star" title="Quant Plus">
<svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="starGradUser" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="{{ color }}" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="{{ color }}"/>
    </linearGradient>
  </defs>
  <path d="M10 1.5L12.4 7L18 7.7L13.8 11.5L15 17L10 14.2L5 17L6.2 11.5L2 7.7L7.6 7L10 1.5Z"
    fill="url(#starGradUser)"
    stroke="{{ color }}"
    stroke-width="0.5"
    stroke-linejoin="round"/>
  <path d="M10 1.5L10 14.2M12.4 7L7.6 7M13.8 11.5L6.2 11.5M5 17L18 7.7M15 17L2 7.7"
    stroke="{{ color }}"
    stroke-width="0.4"
    opacity="0.4"/>
</svg>
</span>
{% endmacro %}

{% macro diamond_badge() %}
<span class="badge-diamond" title="Особый пользователь">
<svg width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diamGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="33%" stop-color="#ef4444"/>
      <stop offset="66%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <path d="M5 2H15L18 7L10 18L2 7L5 2Z"
    fill="url(#diamGrad)"
    stroke="#1e293b"
    stroke-width="0.6"
    stroke-linejoin="round"/>
  <path d="M5 2L10 7L15 2M2 7H18M10 7V18"
    stroke="#1e293b"
    stroke-width="0.5"
    opacity="0.4"/>
</svg>
</span>
{% endmacro %}

{% macro mod_badge() %}
<span class="badge-mod" title="Модератор">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none">
<path d="M8 1L14 4V8C14 11.5 11.5 14.5 8 15.5C4.5 14.5 2 11.5 2 8V4L8 1Z" fill="#10b981" stroke="#059669" stroke-width="0.5"/>
<path d="M5 8L7 10L11 6" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</span>
{% endmacro %}
