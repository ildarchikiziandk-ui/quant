<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Звонок — Quant</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:#000; color:white; height:100vh; height:100dvh; overflow:hidden; }
        #remote-video { position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#111; }
        #local-video { position:fixed; top:env(safe-area-inset-top,16px); right:16px; width:100px; height:150px; border-radius:16px; object-fit:cover; background:#222; border:2px solid rgba(255,255,255,0.3); z-index:10; transform:scaleX(-1); }
        .overlay { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:env(safe-area-inset-top,40px) 0 env(safe-area-inset-bottom,40px) 0; background:linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.7) 100%); }
        .top-info { text-align:center; padding-top:20px; }
        .avatar-wrap { width:100px; height:100px; border-radius:50%; overflow:hidden; background:#333; margin:0 auto 16px; border:3px solid rgba(255,255,255,0.4); }
        .avatar-wrap img { width:100%; height:100%; object-fit:cover; }
        .avatar-letter { width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:700; }
        .caller-name { font-size:24px; font-weight:800; margin-bottom:6px; text-shadow:0 2px 8px rgba(0,0,0,0.5); }
        .call-status { font-size:15px; opacity:0.8; text-shadow:0 1px 4px rgba(0,0,0,0.5); }
        .timer { font-size:20px; font-weight:600; display:none; }
        .controls { display:flex; gap:20px; align-items:center; justify-content:center; padding-bottom:10px; flex-wrap:wrap; }
        .ctrl-btn { display:flex; flex-direction:column; align-items:center; gap:8px; cursor:pointer; }
        .ctrl-btn .icon { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; transition:transform 0.15s, opacity 0.15s; }
        .ctrl-btn .icon:hover { transform:scale(1.1); opacity:0.9; }
        .ctrl-btn .label { font-size:12px; opacity:0.8; }
        .btn-mute .icon { background:rgba(255,255,255,0.2); backdrop-filter:blur(10px); }
        .btn-cam .icon { background:rgba(255,255,255,0.2); backdrop-filter:blur(10px); }
        .btn-speaker .icon { background:rgba(255,255,255,0.2); backdrop-filter:blur(10px); }
        .btn-end .icon { background:#e53935; box-shadow:0 4px 20px rgba(229,57,53,0.5); }
        .btn-flip .icon { background:rgba(255,255,255,0.2); backdrop-filter:blur(10px); }
        .active-btn .icon { background:rgba(255,255,255,0.9) !important; }
        .active-btn .icon span { filter:invert(1); }
        @media (max-width:640px) {
            #local-video { width:80px; height:120px; border-radius:12px; }
            .ctrl-btn .icon { width:52px; height:52px; font-size:20px; }
            .caller-name { font-size:20px; }
        }
    </style>
</head>
<body>
<script>
    const t = localStorage.getItem('theme') || 'light';
</script>

<video id="remote-video" autoplay playsinline></video>
<video id="local-video" autoplay playsinline muted></video>

<div class="overlay">
    <div class="top-info">
        <div class="avatar-wrap">
            {% if other.avatar %}
            <img src="{{ other.avatar }}">
            {% else %}
            <div class="avatar-letter">{{ other.username[0].upper() }}</div>
            {% endif %}
        </div>
        <div class="caller-name">{{ other.name or other.username }}</div>
        <div class="call-status" id="call-status">
            {% if call_type == 'video' %}📹 Видеозвонок{% else %}📞 Голосовой звонок{% endif %}
        </div>
        <div class="timer" id="call-timer">00:00</div>
    </div>

    <div class="controls">
        <div class="ctrl-btn btn-mute" onclick="toggleMute(this)" id="mute-btn">
            <div class="icon"><span>🎤</span></div>
            <div class="label">Микрофон</div>
        </div>
        {% if call_type == 'video' %}
        <div class="ctrl-btn btn-cam" onclick="toggleCamera(this)" id="cam-btn">
            <div class="icon"><span>📷</span></div>
            <div class="label">Камера</div>
        </div>
        <div class="ctrl-btn btn-flip" onclick="flipCamera()">
            <div class="icon"><span>🔄</span></div>
            <div class="label">Перевернуть</div>
        </div>
        {% endif %}
        <div class="ctrl-btn btn-speaker" onclick="toggleSpeaker(this)">
            <div class="icon"><span>🔊</span></div>
            <div class="label">Динамик</div>
        </div>
        <div class="ctrl-btn btn-end" onclick="endCall()">
            <div class="icon"><span>📵</span></div>
            <div class="label">Завершить</div>
        </div>
    </div>
</div>

<script>
const callType = '{{ call_type }}';
const otherUsername = '{{ other.username }}';
const callId = '{{ call_id }}';
let localStream = null;
let peerConnection = null;
let isMuted = false;
let isCamOff = false;
let callStartTime = null;
let timerInterval = null;
let currentFacingMode = 'user';
let audioCtx = null;
let ringtoneNode = null;

const iceConfig = {
    iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        {
            urls: 'turn:147.45.147.124:3478',
            username: 'quant',
            credential: 'QuantTurn2026'
        }
    ]
};

function playRingtone() {
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function beep() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.setValueAtTime(480, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.6);
        }
        beep();
        ringtoneNode = setInterval(beep, 1500);
    } catch(e) {}
}

function stopRingtone() {
    if (ringtoneNode) { clearInterval(ringtoneNode); ringtoneNode = null; }
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
}

function playConnectSound() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.setValueAtTime(523, ctx.currentTime);
        osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.3);
    } catch(e) {}
}

function updateTimer() {
    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('call-timer').textContent = `${m}:${s}`;
}

async function startCall() {
    playRingtone();
    document.getElementById('call-status').textContent = 'Вызов...';
    try {
        const constraints = callType === 'video'
            ? { video: { facingMode: currentFacingMode }, audio: true }
            : { audio: true };
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        if (callType === 'video') {
            document.getElementById('local-video').srcObject = localStream;
        }
        peerConnection = new RTCPeerConnection(iceConfig);
        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
        peerConnection.ontrack = e => {
            stopRingtone();
            playConnectSound();
            const rv = document.getElementById('remote-video');
            rv.srcObject = e.streams[0];
            rv.style.display = 'block';
            document.getElementById('call-status').style.display = 'none';
            document.getElementById('call-timer').style.display = 'block';
            callStartTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        };
        peerConnection.onicecandidate = async e => {
            if (e.candidate) {
                await fetch(`/api/call/${callId}/ice`, {
                    method: 'POST',
                    headers: {'Content-Type':'application/json'},
                    body: JSON.stringify({candidate: e.candidate})
                });
            }
        };
        peerConnection.onconnectionstatechange = () => {
            if (['disconnected','failed','closed'].includes(peerConnection.connectionState)) {
                endCall();
            }
        };
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await fetch(`/api/call/${callId}/offer`, {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({offer})
        });
        pollStatus();
    } catch(e) {
        document.getElementById('call-status').textContent = 'Нет доступа к камере/микрофону';
        console.error(e);
    }
}

let polling = true;
async function pollStatus() {
    while (polling) {
        try {
            const res = await fetch(`/api/call/${callId}/status`);
            const data = await res.json();
            if (data.status === 'accepted' && data.answer && peerConnection.signalingState !== 'stable') {
                stopRingtone();
                await peerConnection.setRemoteDescription(data.answer);
            }
            if (data.status === 'ended' || data.status === 'rejected') {
                endCall();
                return;
            }
            if (data.ice_candidates && data.ice_candidates.length > 0) {
                for (const c of data.ice_candidates) {
                    try { await peerConnection.addIceCandidate(c); } catch(e) {}
                }
            }
        } catch(e) {}
        await new Promise(r => setTimeout(r, 1000));
    }
}

function toggleMute(btn) {
    isMuted = !isMuted;
    localStream?.getAudioTracks().forEach(t => t.enabled = !isMuted);
    btn.querySelector('span').textContent = isMuted ? '🔇' : '🎤';
    btn.classList.toggle('active-btn', isMuted);
    btn.querySelector('.label').textContent = isMuted ? 'Включить' : 'Микрофон';
}

function toggleCamera(btn) {
    isCamOff = !isCamOff;
    localStream?.getVideoTracks().forEach(t => t.enabled = !isCamOff);
    btn.querySelector('span').textContent = isCamOff ? '🚫' : '📷';
    btn.classList.toggle('active-btn', isCamOff);
    btn.querySelector('.label').textContent = isCamOff ? 'Включить' : 'Камера';
}

async function flipCamera() {
    currentFacingMode = currentFacingMode === 'user' ? 'environment' : 'user';
    if (localStream) {
        const videoTrack = localStream.getVideoTracks()[0];
        if (videoTrack) {
            videoTrack.stop();
            const newStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: currentFacingMode },
                audio: false
            });
            const newVideoTrack = newStream.getVideoTracks()[0];
            localStream.removeTrack(videoTrack);
            localStream.addTrack(newVideoTrack);
            document.getElementById('local-video').srcObject = localStream;
            if (peerConnection) {
                const sender = peerConnection.getSenders().find(s => s.track?.kind === 'video');
                if (sender) sender.replaceTrack(newVideoTrack);
            }
        }
    }
}

function toggleSpeaker(btn) {
    btn.classList.toggle('active-btn');
}

async function endCall() {
    polling = false;
    stopRingtone();
    clearInterval(timerInterval);
    localStream?.getTracks().forEach(t => t.stop());
    peerConnection?.close();
    await fetch(`/api/call/${callId}/end`, { method: 'POST' });
    window.location.href = `/messages/${otherUsername}`;
}

startCall();

window.addEventListener('beforeunload', () => {
    fetch(`/api/call/${callId}/end`, { method: 'POST' });
});
</script>
</body>
</html>
