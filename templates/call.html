{% extends "base.html" %}
{% block content %}
<style>
.call-wrap { position:fixed; inset:0; background:#0f0f0f; z-index:500; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; }
.call-avatar { width:120px; height:120px; border-radius:50%; overflow:hidden; border:4px solid rgba(255,255,255,0.3); margin-bottom:20px; display:flex; align-items:center; justify-content:center; background:#333; }
.call-btn { width:64px; height:64px; border-radius:50%; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:24px; transition:all 0.2s; }
.call-btn:hover { transform:scale(1.1); }
#local-video { position:absolute; bottom:140px; right:20px; width:120px; height:180px; border-radius:14px; object-fit:cover; border:2px solid rgba(255,255,255,0.3); }
#remote-video { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
</style>

<div class="call-wrap" id="call-wrap">
    <video id="remote-video" autoplay playsinline style="display:none;"></video>
    <video id="local-video" autoplay playsinline muted></video>

    <div style="position:relative;z-index:2;text-align:center;">
        <div class="call-avatar">
            {% if other.avatar %}<img src="{{ other.avatar }}" style="width:100%;height:100%;object-fit:cover;">{% else %}<span style="font-size:48px;font-weight:700;">{{ other.username[0].upper() }}</span>{% endif %}
        </div>
        <div style="font-size:22px;font-weight:700;margin-bottom:8px;">{{ other.name or other.username }}</div>
        <div id="call-status" style="font-size:15px;opacity:0.7;margin-bottom:40px;">Соединение...</div>
        <div id="call-timer" style="font-size:18px;font-weight:600;margin-bottom:40px;display:none;">00:00</div>

        <div style="display:flex;gap:24px;justify-content:center;">
            <button class="call-btn" id="mute-btn" onclick="toggleMute()" style="background:rgba(255,255,255,0.2);">🎤</button>
            {% if call_type == 'video' %}
            <button class="call-btn" id="cam-btn" onclick="toggleCamera()" style="background:rgba(255,255,255,0.2);">📷</button>
            {% endif %}
            <button class="call-btn" onclick="endCall()" style="background:#e53935;">📵</button>
        </div>
    </div>
</div>

<script>
const callType = '{{ call_type }}';
const otherUsername = '{{ other.username }}';
const callId = '{{ call_id }}';
let localStream = null;
let peerConnection = null;
let isMuted = false;
let isCamOff = false;
let callStartTime = null;
let timerInterval = null;

const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

async function startCall() {
    try {
        const constraints = callType === 'video' ? { video: true, audio: true } : { audio: true };
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        if (callType === 'video') {
            document.getElementById('local-video').srcObject = localStream;
        }
        peerConnection = new RTCPeerConnection(config);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        peerConnection.ontrack = e => {
            const remoteVideo = document.getElementById('remote-video');
            remoteVideo.srcObject = e.streams[0];
            remoteVideo.style.display = 'block';
        };
        peerConnection.onicecandidate = async e => {
            if (e.candidate) {
                await fetch(`/api/call/${callId}/ice`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ candidate: e.candidate })
                });
            }
        };
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        await fetch(`/api/call/${callId}/offer`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ offer: offer })
        });
        document.getElementById('call-status').textContent = 'Вызов...';
        pollCallStatus();
    } catch(e) {
        document.getElementById('call-status').textContent = 'Нет доступа к камере/микрофону';
    }
}

async function pollCallStatus() {
    try {
        const res = await fetch(`/api/call/${callId}/status`);
        const data = await res.json();
        if (data.status === 'accepted' && data.answer) {
            await peerConnection.setRemoteDescription(data.answer);
            document.getElementById('call-status').style.display = 'none';
            document.getElementById('call-timer').style.display = 'block';
            callStartTime = Date.now();
            timerInterval = setInterval(updateTimer, 1000);
        } else if (data.status === 'ended' || data.status === 'rejected') {
            endCall();
            return;
        }
        if (data.ice_candidates) {
            for (const c of data.ice_candidates) {
                await peerConnection.addIceCandidate(c);
            }
        }
    } catch(e) {}
    setTimeout(pollCallStatus, 1000);
}

function updateTimer() {
    const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
    const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const s = String(elapsed % 60).padStart(2, '0');
    document.getElementById('call-timer').textContent = `${m}:${s}`;
}

function toggleMute() {
    isMuted = !isMuted;
    localStream?.getAudioTracks().forEach(t => t.enabled = !isMuted);
    document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🎤';
}

function toggleCamera() {
    isCamOff = !isCamOff;
    localStream?.getVideoTracks().forEach(t => t.enabled = !isCamOff);
    document.getElementById('cam-btn').textContent = isCamOff ? '📷‍' : '📷';
}

async function endCall() {
    clearInterval(timerInterval);
    localStream?.getTracks().forEach(t => t.stop());
    peerConnection?.close();
    await fetch(`/api/call/${callId}/end`, { method: 'POST' });
    window.history.back();
}

startCall();
</script>
{% endblock %}
