{% extends "base.html" %}
{% block content %}
<h2 style="font-size:20px;font-weight:800;margin-bottom:16px;">🔥 Тренды</h2>

{% if trends %}
{% for i, trend in enumerate(trends) %}
<a href="/hashtag/{{ trend.tag }}" style="text-decoration:none;">
    <div class="card" style="display:flex;align-items:center;gap:14px;cursor:pointer;" onmouseover="this.style.background='var(--hover)'" onmouseout="this.style.background='var(--card)'">
        <div style="width:40px;height:40px;background:var(--input-bg);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--text-secondary);flex-shrink:0;">{{ i + 1 }}</div>
        <div style="flex:1;">
            <div style="font-weight:700;font-size:16px;color:#1d9bf0;">#{{ trend.tag }}</div>
            <div style="font-size:13px;color:var(--text-muted);">{{ trend.count }} постов</div>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
</a>
{% endfor %}
{% else %}
<div class="card" style="text-align:center;padding:48px 24px;color:var(--text-secondary);">
    <div style="font-size:48px;margin-bottom:12px;">🔥</div>
    <div style="font-size:16px;font-weight:700;">Нет трендов</div>
    <div style="font-size:14px;margin-top:8px;">Публикуй посты с хэштегами!</div>
</div>
{% endif %}
{% endblock %}
