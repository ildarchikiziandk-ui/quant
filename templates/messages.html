{% extends "base.html" %}
{% block content %}
<h2 style="margin-bottom: 16px;">Сообщения</h2>

{% if conversations %}
    {% for conv_user in conversations %}
    <a href="/messages/{{ conv_user.username }}" style="text-decoration: none; color: #1a1a1a;">
        <div class="card" style="display: flex; align-items: center; gap: 16px; cursor: pointer;">
            <div style="width: 48px; height: 48px; background: #1a1a1a; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; font-weight: bold;">
                {{ conv_user.username[0].upper() }}
            </div>
            <div>
                <div style="font-weight: bold;">{{ conv_user.username }}</div>
            </div>
        </div>
    </a>
    {% endfor %}
{% else %}
    <div class="card" style="text-align: center; color: #888;">
        <p>Нет диалогов. Напиши кому-нибудь через его профиль!</p>
    </div>
{% endif %}
{% endblock %}
