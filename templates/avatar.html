{% macro avatar(user, size=40, font_size=15) %}
<div style="width: {{ size }}px; height: {{ size }}px; border-radius: 50%; overflow: hidden; background: #0f0f0f; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
    {% if user.avatar %}
        <img src="{{ user.avatar }}" style="width: 100%; height: 100%; object-fit: cover;">
    {% else %}
        <span style="color: white; font-size: {{ font_size }}px; font-weight: 600;">{{ user.username[0].upper() }}</span>
    {% endif %}
</div>
{% endmacro %}
