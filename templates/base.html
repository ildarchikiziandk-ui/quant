<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f0f2f5; color: #1a1a1a; }
        .navbar { background: #fff; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
        .navbar-logo { text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #6c63ff, #3ecfcf); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; }
        .logo-text { font-size: 22px; font-weight: bold; background: linear-gradient(135deg, #6c63ff, #3ecfcf); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; align-items: center; gap: 6px; }
        .nav-links a { text-decoration: none; color: #555; font-size: 14px; padding: 7px 14px; border-radius: 8px; transition: background 0.2s; }
        .nav-links a:hover { background: #f0f2f5; color: #1a1a1a; }
        .nav-user { display: flex; align-items: center; gap: 8px; }
        .nav-avatar { width: 32px; height: 32px; background: linear-gradient(135deg, #6c63ff, #3ecfcf); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: bold; }
        .container { max-width: 620px; margin: 30px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.07); }
        .btn { background: linear-gradient(135deg, #6c63ff, #3ecfcf); color: #fff; border: none; padding: 10px 22px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.88; }
        .btn-outline { background: transparent; color: #6c63ff; border: 1.5px solid #6c63ff; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; transition: background 0.2s; }
        .btn-outline:hover { background: #f3f2ff; }
        input, textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; transition: border 0.2s; }
        input:focus, textarea:focus { border-color: #6c63ff; }
        textarea { resize: vertical; min-height: 80px; }
        .post-author { font-weight: bold; margin-bottom: 6px; font-size: 15px; }
        .post-content { margin-bottom: 10px; line-height: 1.6; font-size: 15px; }
        .post-footer { display: flex; align-items: center; gap: 12px; color: #888; font-size: 13px; }
        .like-btn { background: none; border: none; cursor: pointer; font-size: 16px; color: #888; display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; transition: background 0.2s; }
        .like-btn:hover { background: #fff0f3; }
        a { color: #6c63ff; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/" class="navbar-logo">
            <div class="logo-icon">Q</div>
            <span class="logo-text">Quant</span>
        </a>
        <div class="nav-links">
            {% if user %}
                <a href="/">Лента</a>
                <a href="/messages">Сообщения</a>
                <a href="/profile/{{ user.username }}" class="nav-user">
                    <div class="nav-avatar">{{ user.username[0].upper() }}</div>
                    <span style="font-size: 14px; color: #555;">{{ user.name or user.username }}</span>
                </a>
                <a href="/logout" style="color: #e53935;">Выйти</a>
            {% else %}
                <a href="/login">Войти</a>
                <a href="/register"><button class="btn" style="padding: 8px 16px;">Регистрация</button></a>
            {% endif %}
        </div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
