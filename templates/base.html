<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #0f0f0f; }
        .navbar { background: #fff; padding: 0 24px; height: 56px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e8e8e8; position: sticky; top: 0; z-index: 100; }
        .navbar-logo { text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 32px; height: 32px; background: #0f0f0f; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
        .logo-text { font-size: 20px; font-weight: 700; color: #0f0f0f; letter-spacing: -0.5px; }
        .nav-links { display: flex; align-items: center; gap: 4px; }
        .nav-links a { text-decoration: none; color: #555; font-size: 14px; padding: 7px 12px; border-radius: 8px; transition: background 0.15s; font-weight: 500; }
        .nav-links a:hover { background: #f5f5f5; color: #0f0f0f; }
        .nav-user { display: flex; align-items: center; gap: 8px; padding: 5px 10px !important; }
        .nav-avatar { width: 28px; height: 28px; background: #0f0f0f; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 12px; font-weight: 600; }
        .container { max-width: 600px; margin: 24px auto; padding: 0 16px; }
        .card { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 12px; border: 1px solid #e8e8e8; }
        .btn { background: #0f0f0f; color: #fff; border: none; padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.15s; }
        .btn:hover { background: #333; }
        .btn-outline { background: transparent; color: #0f0f0f; border: 1.5px solid #e0e0e0; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.15s; }
        .btn-outline:hover { border-color: #0f0f0f; }
        .btn-follow { background: #0f0f0f; color: #fff; border: none; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; transition: background 0.15s; }
        .btn-follow:hover { background: #333; }
        .btn-unfollow { background: transparent; color: #0f0f0f; border: 1.5px solid #e0e0e0; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.15s; }
        .btn-unfollow:hover { border-color: #0f0f0f; background: #f5f5f5; }
        input, textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; transition: border 0.15s; font-family: inherit; }
        input:focus, textarea:focus { border-color: #0f0f0f; }
        textarea { resize: vertical; min-height: 80px; }
        .post-author { font-weight: 600; margin-bottom: 4px; font-size: 14px; }
        .post-username { color: #888; font-size: 13px; font-weight: 400; }
        .post-content { margin-bottom: 12px; line-height: 1.6; font-size: 15px; }
        .post-footer { display: flex; align-items: center; gap: 8px; color: #888; font-size: 13px; }
        .like-btn { background: none; border: none; cursor: pointer; font-size: 14px; color: #888; display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 20px; transition: background 0.15s; font-weight: 500; }
        .like-btn:hover { background: #fff0f3; color: #e0245e; }
        .like-btn.liked { color: #e0245e; }
        .alert-error { background: #fff5f5; border: 1px solid #ffd0d0; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: #cc0000; font-size: 14px; }
        a { color: inherit; text-decoration: none; }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/" class="navbar-logo">
            <div class="logo-icon">
                <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="9" cy="9" r="3" fill="white"/>
                    <path d="M9 2 L9 6" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    <path d="M9 12 L9 16" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    <path d="M2 9 L6 9" stroke="white" stroke-width="2" stroke-linecap="round"/>
                    <path d="M12 9 L16 9" stroke="white" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <span class="logo-text">Quant</span>
        </a>
        <div class="nav-links">
            {% if user %}
                <a href="/">Лента</a>
                <a href="/search">Поиск</a>
                <a href="/messages">Сообщения</a>
                <a href="/settings">Настройки</a>
                <a href="/profile/{{ user.username }}" class="nav-user">
                    <div class="nav-avatar">{{ user.username[0].upper() }}</div>
                    <span>{{ user.name or user.username }}</span>
                </a>
                <a href="/logout" style="color: #e53935;">Выйти</a>
            {% else %}
                <a href="/login">Войти</a>
                <a href="/register"><button class="btn" style="padding: 8px 16px; font-size: 13px;">Регистрация</button></a>
            {% endif %}
        </div>
    </div>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
