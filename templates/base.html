<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #0f0f0f; }
        .layout { display: flex; min-height: 100vh; max-width: 1100px; margin: 0 auto; gap: 24px; padding: 0 16px; }
        .sidebar { width: 72px; padding: 16px 0; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0; }
        .sidebar-logo { width: 44px; height: 44px; background: #0f0f0f; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; text-decoration: none; }
        .nav-item { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #555; font-size: 20px; transition: background 0.15s; position: relative; }
        .nav-item:hover { background: #e8e8e8; color: #0f0f0f; }
        .nav-item.active { background: #0f0f0f; color: white; }
        .nav-badge { position: absolute; top: 6px; right: 6px; background: #e53935; color: white; font-size: 9px; font-weight: 700; border-radius: 8px; padding: 1px 4px; min-width: 14px; text-align: center; }
        .nav-post { width: 44px; height: 44px; background: #0f0f0f; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; cursor: pointer; border: none; margin-top: auto; text-decoration: none; }
        .nav-post:hover { background: #333; }
        .main { flex: 1; max-width: 600px; padding: 24px 0; }
        .right { width: 280px; padding: 24px 0; flex-shrink: 0; }
        .card { background: #fff; border-radius: 12px; padding: 18px; margin-bottom: 12px; border: 1px solid #e8e8e8; }
        .btn { background: #0f0f0f; color: #fff; border: none; padding: 9px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: background 0.15s; }
        .btn:hover { background: #333; }
        .btn-outline { background: transparent; color: #0f0f0f; border: 1.5px solid #e0e0e0; padding: 8px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all 0.15s; }
        .btn-outline:hover { border-color: #0f0f0f; }
        .btn-follow { background: #0f0f0f; color: #fff; border: none; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-unfollow { background: transparent; color: #0f0f0f; border: 1.5px solid #e0e0e0; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-size: 13px; }
        input, textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #e0e0e0; border-radius: 8px; font-size: 14px; margin-bottom: 12px; outline: none; transition: border 0.15s; font-family: inherit; }
        input:focus, textarea:focus { border-color: #0f0f0f; }
        textarea { resize: vertical; min-height: 80px; }
        .post-username { color: #888; font-size: 13px; }
        .post-content { margin-bottom: 12px; line-height: 1.6; font-size: 15px; }
        .post-footer { display: flex; align-items: center; gap: 8px; color: #888; font-size: 13px; }
        .like-btn { background: none; border: none; cursor: pointer; font-size: 14px; color: #888; display: flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 20px; transition: background 0.15s; font-weight: 500; }
        .like-btn:hover { background: #fff0f3; color: #e0245e; }
        .like-btn.liked { color: #e0245e; }
        .alert-error { background: #fff5f5; border: 1px solid #ffd0d0; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; color: #cc0000; font-size: 14px; }
        a { color: inherit; text-decoration: none; }
        .badge-owner { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: #0f0f0f; border-radius: 4px; margin-left: 3px; vertical-align: middle; }
        .badge-verify { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; background: #1d9bf0; border-radius: 50%; margin-left: 3px; vertical-align: middle; }
        .badge-star { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin-left: 3px; vertical-align: middle; }
        .right-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid #e8e8e8; }
        .right-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
        .suggest-item { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f5f5f5; }
        .suggest-item:last-child { border-bottom: none; }
        .suggest-avatar { width: 36px; height: 36px; background: #0f0f0f; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 13px; font-weight: 600; flex-shrink: 0; }
        @media (max-width: 768px) { .right { display: none; } .sidebar { width: 56px; } }
    </style>
</head>
<body>
<div class="layout">
    <div class="sidebar">
        <a href="/" class="sidebar-logo">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
                <circle cx="12" cy="12" r="4" fill="white"/>
                <path d="M12 3v4M12 17v4M3 12h4M17 12h4" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </a>
        {% if user %}
            <a href="/" class="nav-item" title="Лента">🏠</a>
            <a href="/search" class="nav-item" title="Поиск">🔍</a>
            <a href="/notifications" class="nav-item" title="Уведомления">
                🔔{% if unread > 0 %}<span class="nav-badge">{{ unread }}</span>{% endif %}
            </a>
            <a href="/messages" class="nav-item" title="Сообщения">✉️</a>
            <a href="/profile/{{ user.username }}" class="nav-item" title="Профиль">👤</a>
            <a href="/settings" class="nav-item" title="Настройки">⚙️</a>
            <a href="/logout" class="nav-item" title="Выйти" style="color: #e53935;">🚪</a>
            <a href="/" class="nav-post" title="Новый пост">✏️</a>
        {% else %}
            <a href="/login" class="nav-item" title="Войти">🔑</a>
            <a href="/register" class="nav-post" title="Регистрация">+</a>
        {% endif %}
    </div>
    <div class="main">
        {% block content %}{% endblock %}
    </div>
    {% if user %}
    <div class="right">
        <div class="right-card">
            <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 4px;">
                <div style="width: 40px; height: 40px; background: #0f0f0f; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 15px; font-weight: 600;">{{ user.username[0].upper() }}</div>
                <div>
                    <div style="font-weight: 600; font-size: 14px;">{{ user.name or user.username }}</div>
                    <div style="color: #888; font-size: 13px;">@{{ user.username }}</div>
                </div>
            </div>
        </div>
        <div class="right-card">
            <h3>Поиск</h3>
            <form method="get" action="/search">
                <input type="text" name="q" placeholder="Найти пользователей..." style="margin-bottom: 0;">
            </form>
        </div>
    </div>
    {% endif %}
</div>
</body>
</html>
