{% if other is defined and other and can_send and v3_calls_on() %}<button type="button" class="icon-btn" title="Аудиозвонок" data-call="{{ other.username }}" data-name="{{ dname(other) }}" data-avatar="{{ other.avatar or '' }}">{{ icon_svg("phone") }}</button>
<button type="button" class="icon-btn" title="Видеозвонок" data-call="{{ other.username }}" data-video="1" data-name="{{ dname(other) }}" data-avatar="{{ other.avatar or '' }}">{{ icon_svg("video") }}</button>{% endif %}
