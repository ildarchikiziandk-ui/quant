{% if other is defined and other %}<button type="button" class="icon-btn cmp-tool" title="Стикеры" data-stickers data-to="{{ other.username }}">{{ icon_svg("whale") }}</button>
<button type="button" class="icon-btn cmp-tool" title="Опрос или игра" data-v3-attach="{{ other.username }}">{{ icon_svg("plus") }}</button>
<button type="button" class="icon-btn cmp-tool" title="Сообщение с эффектом" data-v3-effects>{{ icon_svg("sparkle") }}</button>{% endif %}
