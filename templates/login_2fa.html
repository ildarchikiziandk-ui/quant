{% extends "bare.html" %}
{% block title %}Подтверждение входа — {{ brand }}{% endblock %}
{% block card %}
<h1 class="center" style="font-size:20px;font-weight:800;margin-bottom:4px">🔐 Двухфакторная защита</h1>
<p class="center muted small mb">Введите 6-значный код из приложения-аутентификатора</p>
{% if error %}<div class="alert error">{{ error }}</div>{% endif %}
<form method="post" action="/login/2fa">
  <input type="hidden" name="next" value="{{ next or '/' }}">
  <input name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="000 000" autocomplete="one-time-code" required autofocus style="text-align:center;font-size:24px;letter-spacing:6px;margin-bottom:12px">
  <button class="btn block">Подтвердить</button>
</form>
<p class="center mt small"><a href="/login" class="muted">← Назад</a></p>
{% endblock %}
