name: Nuvora bot

# Claude заходит в Nuvora от имени claude_ai: выполняет команды и показывает, что нового.
# Нужен секрет репозитория NUVORA_BOT_PASSWORD (Settings → Secrets and variables → Actions).
on:
  workflow_dispatch:
    inputs:
      commands:
        description: "JSON-список команд (см. tools/bot_remote.py)"
        default: "[]"
        required: false
      stay:
        description: "Сколько минут оставаться в сети"
        default: "3"
        required: false

concurrency:
  group: nuvora-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python tools/bot_remote.py
        env:
          NUVORA_BOT_PASSWORD: ${{ secrets.NUVORA_BOT_PASSWORD }}
          BOT_COMMANDS: ${{ github.event.inputs.commands }}
          BOT_STAY: ${{ github.event.inputs.stay }}
