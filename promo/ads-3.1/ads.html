<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:Onest;font-weight:100 900;src:url(onest-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0400-045F,U+2116}
@font-face{font-family:Onest;font-weight:100 900;src:url(onest-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Unb;font-weight:200 900;src:url(unbounded-cyrillic-wght-normal.woff2) format("woff2");unicode-range:U+0400-045F,U+2116}
@font-face{font-family:Unb;font-weight:200 900;src:url(unbounded-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+2000-206F}
:root{--ink:#1f1d1a;--paper:#f6f1e8;--whale:#2f6487;--card:#fffdf9;--card2:#fbf7f0;--border:#e7ddcd;--t2:#6b6357;--t3:#a0968a;--input:#f1eadf;--ok:#3c9a5f;--amber:#c98a1b;--red:#d63c3c;--bg:var(--paper);--text:var(--ink);--onink:#fbf7f0}
.dark{--bg:#141311;--card:#1c1b18;--card2:#22201d;--border:#2e2b27;--text:#f3ece1;--t2:#a69d90;--t3:#6f685e;--input:#252320;--whale:#7fb0d3;--ink:#f3ece1;--onink:#1a1917;--ok:#5cc27f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:#000}
#st{position:relative;width:540px;height:960px;overflow:hidden;background:var(--bg);color:var(--text);font-family:Onest,sans-serif}
.abs{position:absolute}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ghost{left:-40px;top:520px;font:800 330px/1 Unb;color:var(--text);opacity:.045;white-space:nowrap;letter-spacing:-.04em}
.bar{left:24px;right:24px;top:22px;height:3px;border-radius:3px;background:color-mix(in srgb,var(--text) 12%,transparent)}
.bar i{display:block;height:100%;border-radius:3px;background:var(--whale);width:0}
.badge{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:99px;border:1px solid var(--border);background:var(--card);font:600 15px Onest}
.badge img{width:26px;height:26px;border-radius:8px}
.hook{left:34px;right:34px;top:300px;font:700 46px/1.1 Unb;letter-spacing:-.03em}
.hook .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:6px;margin-bottom:-6px}
.hook .w>span{display:inline-block}
.hook .hl{color:var(--whale);position:relative}
.hook .hl:after{content:"";position:absolute;left:0;bottom:2px;height:6px;border-radius:4px;background:var(--whale);opacity:.25;width:var(--u,0%)}
.head{left:32px;right:32px;top:62px}
.chip{display:inline-block;padding:5px 11px;border-radius:99px;background:var(--whale);color:var(--bg);font:700 12px/1.2 Onest;letter-spacing:.08em}
.head h2{font:700 30px/1.12 Unb;letter-spacing:-.03em;margin-top:12px}
.head p{font:500 16px/1.35 Onest;color:var(--t2);margin-top:8px}
.scr{left:28px;right:28px;top:262px;height:520px;border-radius:30px;background:var(--card);border:1px solid var(--border);overflow:hidden;box-shadow:0 30px 60px -30px rgba(40,30,15,.35)}
.dark .scr{box-shadow:0 30px 60px -24px rgba(0,0,0,.8)}
.top{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--border);font:700 17px Onest}
.top small{display:block;font:500 12px Onest;color:var(--t3)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font:700 15px Onest}
.msgs{position:absolute;left:0;right:0;top:71px;bottom:66px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:14px;overflow:hidden}
.b{max-width:80%;padding:10px 14px;border-radius:18px;font:500 15px/1.38 Onest;white-space:pre-wrap}
.b.me{align-self:flex-end;background:var(--ink);color:var(--onink);border-bottom-right-radius:6px}
.b.th{align-self:flex-start;background:var(--input);border-bottom-left-radius:6px}
.b .lk{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 12px;border-radius:10px;background:var(--card);color:var(--whale);font-weight:700;font-size:14px}
.inbar{position:absolute;left:12px;right:12px;bottom:12px;height:44px;border-radius:14px;background:var(--input);display:flex;align-items:center;padding:0 8px 0 14px;font:500 15px Onest;gap:8px}
.inbar .tx{flex:1;white-space:nowrap;overflow:hidden}
.inbar .ph{color:var(--t3)}
.send{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--onink);display:grid;place-items:center}
.send svg{width:16px;height:16px}
.car{display:inline-block;width:2px;height:1.05em;background:var(--whale);vertical-align:-2px;margin-left:1px}
.dots{align-self:flex-start;background:var(--input);border-radius:18px;padding:13px 16px;display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--t3)}
.stk{padding:6px 12px;border-radius:10px;background:var(--whale);color:var(--bg);font:700 14px Onest;display:inline-flex;gap:6px;align-items:center;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--border)}
.row .nm{flex:1;font:700 16px Onest}
.row .nm small{display:block;font:500 13px Onest;color:var(--t2);margin-top:2px}
.btn{padding:9px 16px;border-radius:12px;background:var(--ink);color:var(--onink);font:700 14px Onest;display:inline-flex;align-items:center;gap:6px}
.btn.soft{background:var(--input);color:var(--text)}
.toast{left:50%;bottom:28px;transform:translateX(-50%);padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--onink);font:600 15px Onest;white-space:nowrap;display:flex;gap:8px;align-items:center}
.end{inset:0;background:#1f1d1a;color:#fbf7f0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.end .cta{font:600 22px/1.3 Onest;color:#d9cfbf;max-width:400px}
.end img{width:96px;height:96px;border-radius:26px;margin:28px 0 18px}
.end .nm{font:700 60px/1 Unb;letter-spacing:-.04em}
.end .url{margin-top:26px;padding:14px 34px;border-radius:99px;background:#f6f1e8;color:#1f1d1a;font:700 40px/1 Unb;letter-spacing:-.03em}
.end .sm{margin-top:20px;font:500 17px Onest;color:#a69d90}
.grid{display:grid;gap:7px}
.cell{border-radius:10px;display:grid;place-items:center;font:700 26px Unb;text-transform:uppercase}
.k{position:absolute}
</style></head><body><div id="st"></div>
<script>
// ---------- движок ----------
const T=14, st=document.getElementById('st');
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bk=x=>{const c=1.9,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const x=new XMLHttpRequest();x.open('GET','icons.svg',false);x.send();document.body.insertAdjacentHTML('afterbegin',x.responseText);
const I=(n,c='i')=>`<svg class="${c}"><use href="#${n}"/></svg>`;
function el(html,parent=st){const d=document.createElement('div');d.innerHTML=html.trim();const e=d.firstChild;parent.appendChild(e);return e}
function show(e,t,t0,{d=.4,dy=20,sc=.94,out=null,od=.3}={}){let k=eo(P(t,t0,t0+d)),s=bk(P(t,t0,t0+d));
  if(out!==null){const o=P(t,out,out+od);k*=1-o}
  e.style.opacity=k;e.style.transform=`translateY(${(1-s)*dy}px) scale(${lerp(sc,1,s)})`;e.style.visibility=k<=0.001?'hidden':'visible'}
function typ(e,text,t,t0,cps=16,caret=true){const n=Math.floor(cl((t-t0)*cps,0,text.length));const on=t>=t0-.3&&n<text.length+ (caret?1:0);
  e.innerHTML=esc(text.slice(0,n))+(caret&&t>=t0-.4&&(n<text.length||Math.floor(t*2.4)%2==0)?'<span class="car"></span>':'');return n}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function press(e,t,t0){const k=P(t,t0,t0+.22);const s=k<.5?1-.12*k*2:.88+.12*(k-.5)*2;e.style.transform=`scale(${k>0&&k<1?s:1})`}
function count(t,t0,t1,a,b){return Math.round(lerp(a,b,eio(P(t,t0,t1))))}
const fmt=n=>n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');

// общий каркас: полоска прогресса, призрачный фон, крючок, шапка, экран, финал
function frame(ad){
  if(ad.dark)st.classList.add('dark');
  const ghost=el(`<div class="abs ghost">${ad.ghost||'3.1'}</div>`);
  const bar=el(`<div class="abs bar"><i></i></div>`);
  const badge=el(`<div class="abs" style="left:34px;top:226px"><span class="badge"><img src="logo-180.png">Nuvora 3.1</span></div>`);
  const hook=el(`<div class="abs hook">${ad.hook.map((w,i)=>`<span class="w"><span class="${(ad.hl||[]).includes(i)?'hl':''}">${w}</span></span>`).join(' ')}</div>`);
  const words=[...hook.querySelectorAll('.w>span')];
  const head=el(`<div class="abs head"><span class="chip">${ad.chip}</span><h2>${ad.title}</h2><p>${ad.sub}</p></div>`);
  const scr=ad.noScreen?null:el(`<div class="abs scr"></div>`);
  const upd=ad.build(scr,st);
  const end=el(`<div class="abs end"><div class="cta">${ad.cta}</div><img src="logo-180.png"><div class="nm">Nuvora</div><div class="url">nvra.ru</div><div class="sm">бесплатно · сайт и Android</div></div>`);
  const ekids=[...end.children];
  const H=ad.hookEnd||2.6, E=10.9;
  return t=>{
    bar.firstChild.style.width=(cl(t/E)*100)+'%';
    ghost.style.transform=`translateX(${-t*14}px)`;
    // крючок: слова выезжают снизу по очереди
    words.forEach((w,i)=>{const k=eo(P(t,.15+i*.14,.6+i*.14));w.style.transform=`translateY(${(1-k)*110}%)`});
    hook.querySelectorAll('.hl').forEach(h=>h.style.setProperty('--u',(eo(P(t,.9,1.5))*100)+'%'));
    const ho=eio(P(t,H,H+.45));
    hook.style.opacity=1-ho;hook.style.transform=`translateY(${-ho*80}px) scale(${1-ho*.12})`;hook.style.filter=`blur(${ho*6}px)`;
    show(badge,t,0,{d:.35,out:H,od:.3});
    show(head,t,H+.2,{d:.5,dy:30});
    if(scr){const k=eo(P(t,H+.3,H+.9));scr.style.opacity=k;scr.style.transform=`translateY(${(1-k)*120}px) rotate(${(1-k)*-3}deg)`}
    upd(t);
    // финал: чернильный круг из центра
    const r=eio(P(t,E,E+.55))*1150;end.style.clipPath=`circle(${r}px at 50% 62%)`;end.style.visibility=r>0?'visible':'hidden';
    ekids.forEach((c,i)=>show(c,t,E+.35+i*.12,{d:.5,dy:26,sc:.8}));
  };
}

// ---------- ролики ----------
const ADS={};
const avc=['#2f6487','#c98a1b','#3c9a5f','#b4532a','#6b5b95','#1f1d1a','#8a6d3b'];

ADS[1]={file:'nuva',hook:['Спроси','соцсеть.','Она','ответит.'],hl:[3],chip:'ПОМОЩНИК НУВА',
 title:'Спроси — Нува подскажет',sub:'понимает опечатки и даже английскую раскладку',cta:'Спроси Нуву сам',ghost:'Нува',
 build(s){
  s.innerHTML=`<div class="top"><div class="av" style="background:var(--whale)">${I('whale')}</div><div>Нува<small>помощник Nuvora · без интернета-гигантов</small></div></div><div class="msgs"></div><div class="inbar"><div class="tx"></div><div class="send">${I('send')}</div></div>`;
  s.querySelector('.top small').textContent='помощник Nuvora';
  const m=s.querySelector('.msgs'),tx=s.querySelector('.tx'),snd=s.querySelector('.send');
  const q1='как сменть пороль',q2='ghbdtn';
  const u1=el(`<div class="b me">${q1}</div>`,m),d1=el(`<div class="dots"><i></i><i></i><i></i></div>`,m);
  const a1=el(`<div class="b th"><b>Как сменить пароль?</b>\nНастройки → Аккаунт → «Сменить пароль»: введите текущий пароль и новый.<br><span class="lk">${I('key')}Сменить пароль</span></div>`,m);
  const u2=el(`<div class="b me">${q2}</div>`,m),d2=el(`<div class="dots"><i></i><i></i><i></i></div>`,m);
  const a2=el(`<div class="b th">Похоже, текст набран в английской раскладке — я прочитала его как «привет».\n\nПривет! Я Нува, помощник Nuvora 👋</div>`,m);
  const s1=el(`<div class="abs stk" style="right:30px;top:214px">${I('check')} опечатки поняла</div>`);
  const s2=el(`<div class="abs stk" style="left:30px;top:798px">${I('keyboard')} раскладку тоже</div>`);
  const seq=[[u1,4.35,null],[d1,4.5,5.25],[a1,5.3,null],[u2,7.05,null],[d2,7.2,7.9],[a2,7.95,null]];
  return t=>{
    if(t<4.3)typ(tx,q1,t,3.4,15);else if(t<6.1){tx.innerHTML='<span class="ph">Спросите что-нибудь…</span>'}else if(t<7)typ(tx,q2,t,6.3,10);else tx.innerHTML='<span class="ph">Спросите что-нибудь…</span>';
    if(t<3.4)tx.innerHTML='<span class="ph">Спросите что-нибудь…</span>';
    press(snd,t,t<6?4.2:6.9);
    seq.forEach(([e,a,b])=>{const vis=t>=a&&(b===null||t<b);e.style.display=vis?'':'none';if(vis)show(e,t,a,{d:.35,dy:14,sc:.9})});
    [d1,d2].forEach(d=>[...d.children].forEach((i,j)=>i.style.transform=`translateY(${Math.sin(t*12-j*1.1)*3}px)`));
    show(s1,t,5.7,{d:.45,sc:.6,out:10.4});show(s2,t,8.5,{d:.45,sc:.6,out:10.4});
    s1.style.transform+=' rotate(4deg)';s2.style.transform+=' rotate(-4deg)';
  }}};

ADS[2]={file:'logins',dark:1,hook:['Твой','логин','всё','ещё','ivan_1998_x?'],hl:[4],chip:'КРАСИВЫЕ ЛОГИНЫ',
 title:'Короткий логин — за баллы',sub:'не за деньги: копи баллы и занимай @fox, @neon, @lucky',cta:'Займи свой, пока свободен',ghost:'@fox',
 build(s){
  s.innerHTML=`<div class="top"><div style="flex:1">Красивые логины<small>до трёх логинов на человека</small></div><span class="btn soft" style="font-size:13px">${I('star')}<b class="bal">3 240</b></span></div>
  <div style="padding:14px 16px 6px"><div class="inbar" style="position:static;padding-left:12px">${I('search')}<div class="tx"></div></div></div>
  <div class="list"></div><div class="prof abs" style="inset:0;background:var(--card);display:flex;flex-direction:column;align-items:center;padding-top:56px"></div>`;
  const tx=s.querySelector('.tx'),bal=s.querySelector('.bal'),list=s.querySelector('.list'),prof=s.querySelector('.prof');
  const rows=[['fox','3 000'],['foxy','2 000'],['neon','2 000'],['lucky','2 000']].map(([n,p],i)=>el(`<div class="row"><div class="av" style="background:${avc[i]}">@</div><div class="nm">@${n}<small>${p} баллов · свободен</small></div><span class="btn">Занять</span></div>`,list));
  const b0=rows[0].querySelector('.btn');
  prof.innerHTML=`<div class="av" style="width:110px;height:110px;font-size:40px;background:linear-gradient(#c98a1b,#b4532a)">А</div>
   <div style="font:700 26px Unb;margin-top:18px">Алина</div><div class="hd" style="font:700 22px Onest;color:var(--whale);margin-top:6px">@fox ✦</div>
   <div style="display:flex;gap:8px;margin-top:22px" class="al"><span class="btn soft">@alina</span><span class="btn soft">@neon</span></div>
   <div style="margin-top:18px;color:var(--t2);font:500 14px Onest">основной логин + два дополнительных</div>`;
  const al=[...prof.querySelectorAll('.al .btn')],hd=prof.querySelector('.hd');
  const toast=el(`<div class="abs toast">${I('check')} @fox теперь ваш</div>`,s);
  return t=>{
    typ(tx,'fox',t,3.5,6);if(t<3.3)tx.innerHTML='<span class="ph">найти логин</span>';
    rows.forEach((r,i)=>{const vis=t>3.7+i*.12;r.style.opacity=vis?eo(P(t,3.7+i*.12,4.1+i*.12)):0;r.style.transform=`translateX(${(1-eo(P(t,3.7+i*.12,4.1+i*.12)))*40}px)`});
    press(b0,t,5.3);if(t>5.45){b0.innerHTML=I('check')+'Ваш';b0.style.background='var(--ok)'}else b0.textContent='Занять';
    bal.textContent=fmt(count(t,5.5,6.4,3240,240));
    show(toast,t,5.5,{d:.35,out:6.9});toast.style.transform+=' translateX(-50%)';
    const k=eio(P(t,7.1,7.6));prof.style.clipPath=`inset(${(1-k)*100}% 0 0 0)`;
    show(hd,t,7.6,{d:.5,sc:.5});al.forEach((a,i)=>show(a,t,8.3+i*.25,{sc:.6}));
  }}};

ADS[3]={file:'kapsula',hook:['Что','ты','скажешь','себе','через','год?'],hl:[4,5],chip:'КАПСУЛА ВРЕМЕНИ',
 title:'Письмо себе в будущее',sub:'до срока его не откроет никто — даже ты',cta:'Напиши своё письмо',ghost:'2027',
 build(s){
  s.innerHTML=`<div class="top">${I('hourglass')}<div>Капсула времени</div></div>
  <div class="pad" style="padding:16px"><div class="ta" style="height:190px;border-radius:16px;background:var(--input);padding:16px;font:500 18px/1.45 Onest"></div>
  <div style="margin:16px 0 8px;color:var(--t2);font:600 14px Onest">Открыть через</div>
  <div class="pr" style="display:flex;gap:8px"><span class="btn soft">месяц</span><span class="btn soft">полгода</span><span class="btn soft">год</span><span class="btn soft">дату…</span></div>
  <div class="go btn" style="margin-top:18px;width:100%;justify-content:center;padding:14px;font-size:16px">${I('lock')}Запечатать</div></div>
  <div class="env abs" style="inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card)">
   <div class="lt" style="width:230px;height:150px;border-radius:18px;background:var(--whale);display:grid;place-items:center;color:var(--bg);position:relative">${I('mail','i big')}<div class="lc abs" style="right:-14px;bottom:-14px;width:54px;height:54px;border-radius:50%;background:var(--ink);color:var(--onink);display:grid;place-items:center">${I('lock')}</div></div>
   <div style="font:700 22px Unb;margin-top:34px">Откроется</div><div style="font:600 19px Onest;color:var(--whale);margin-top:6px">22 октября 2027</div>
   <div class="cd" style="font:700 30px Unb;margin-top:22px;letter-spacing:-.02em"></div><div style="color:var(--t3);font:500 13px Onest;margin-top:4px">дней · часов · минут · секунд</div></div>`;
  s.querySelector('.big').setAttribute('style','width:70px;height:70px;stroke-width:1.6');
  const ta=s.querySelector('.ta'),pr=[...s.querySelectorAll('.pr .btn')],go=s.querySelector('.go'),env=s.querySelector('.env'),pad=s.querySelector('.pad'),lt=s.querySelector('.lt'),cd=s.querySelector('.cd'),lc=s.querySelector('.lc');
  const txt='Привет, это я из 2026.\nТы всё-таки выучил гитару? 🎸\nИ не забудь позвонить бабушке.';
  return t=>{
    typ(ta,txt,t,3.4,24);
    const sel=t>6.15;pr[2].style.background=sel?'var(--ink)':'';pr[2].style.color=sel?'var(--onink)':'';press(pr[2],t,6);
    press(go,t,6.8);
    const k=eio(P(t,7.05,7.6));pad.style.transform=`scale(${1-k*.5}) translateY(${k*80}px)`;pad.style.opacity=1-k;
    env.style.opacity=eo(P(t,7.35,7.75));env.style.visibility=t>7.3?'visible':'hidden';
    const b=P(t,7.4,8);lt.style.transform=`scale(${lerp(.4,1,bk(b))}) rotate(${(1-bk(b))*-12}deg)`;
    show(lc,t,8,{d:.4,sc:.2});
    let rem=365*86400-Math.floor(Math.max(0,t-8)*1)-1;const D=Math.floor(rem/86400),h=Math.floor(rem%86400/3600),mi=Math.floor(rem%3600/60),se=rem%60;
    cd.textContent=`${D} : ${String(h).padStart(2,'0')} : ${String(mi).padStart(2,'0')} : ${String(se).padStart(2,'0')}`;
